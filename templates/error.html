<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请求没有成功 · 钢材表面缺陷检测</title>
<style>
  :root{
    --paper:#E7E9E3; --card:#F5F6F2; --ink:#14181B; --steel:#5A6367;
    --line:#C6CBC2; --amber:#B8860B;
    --sans:"Bahnschrift","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    padding:24px;
  }
  .panel{
    width:min(520px,100%); background:var(--card);
    border:1px solid var(--line); border-radius:2px;
    padding:32px 36px 34px;
  }
  .rule{width:44px;height:3px;background:var(--amber);margin-bottom:22px}
  h1{font-size:22px;font-weight:600;letter-spacing:.02em;margin:0 0 10px}
  p{margin:0 0 26px;color:var(--steel);font-size:15px;line-height:1.7}
  a{
    display:inline-block;font-size:14px;color:var(--ink);text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:2px;
  }
  a:hover{border-bottom-color:var(--amber)}
</style>
</head>
<body>
  <section class="panel">
    <div class="rule"></div>
    <h1>请求没有成功</h1>
    <p>{{ message }}</p>
    <a href="/">← 返回检测页</a>
  </section>
</body>
</html>
